server:
  port: ${PORT:8080}

spring:
  application:
    name: pharmacare-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pharmacare}
    username: ${DATABASE_USERNAME:pharmacare}
    password: ${DATABASE_PASSWORD:pharmacare}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
